<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
  <head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script src="https://kit.fontawesome.com/57faba85b1.js"crossorigin="anonymous"></script>
	    <title>Lista de Clientes</title>
	    <link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<title>Alta Cliente</title>
	</head>
	<body>

		 <style>
		        body {
		            background-color: #f8f9fa;
		            display: flex;
		            align-items: center;
		            justify-content: center;
		            min-height: 100vh;
		        }
		        .container {
					
		            background-color: #ffffff;
		            padding: 30px;
		            border-radius: 8px;
		            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
		            max-width: 600px;
		        }
		       
		        .form-group label {
		            font-weight: 500;
		        }
		        .btn-primary {
		            background-color: #007bff;
		            border-color: #007bff;
		        }
		        .btn-primary:hover {
		            background-color: #0056b3;
		            border-color: #0056b3;
		        }
		        .btn-secondary {
		            margin-left: 10px;
		        }
				h2 {
				    color: #343a40;
				    text-align: center;
				    margin-bottom: 20px;
				}
		    </style>
		</head>
		<body>

		<div class="container">
		    <h2>Alta de Cliente</h2>

		    <form th:action="@{/altaCliente}" method="post" th:object="${cliente}">
		        <div class="mb-3 form-group">
		            <label for="nombre">Nombre:</label>
		            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Ingrese el nombre" required>
		        </div>

		        <div class="mb-3 form-group">
		            <label for="apellido">Apellido:</label>
		            <input type="text" id="apellido" th:field="*{apellido}" class="form-control" placeholder="Ingrese el apellido" required>
		        </div>

		        <div class="mb-3 form-group">
		            <label for="dni">DNI:</label>
		            <input type="number" id="dni" th:field="*{dni}" class="form-control" placeholder="Ingrese el DNI" required>
		        </div>

		        <div class="mb-3 form-group">
		            <label for="nombreUsuario">Nombre de Usuario:</label>
		            <input type="text" id="nombreUsuario" th:field="*{nombreUsuario}" class="form-control" placeholder="Ingrese el nombre de usuario" required>
		        </div>

		        <div class="mb-3 form-group">
		            <label for="clave">Clave:</label>
		            <input type="password" id="clave" th:field="*{clave}" class="form-control" placeholder="Ingrese la clave" required>
		        </div>

		        <div class="mb-3 form-group">
		            <label for="direccion">Dirección:</label>
		            <input type="text" id="direccion" th:field="*{direccion}" class="form-control" placeholder="Ingrese la dirección" required>
		        </div>

		        <div class="mb-3 form-group">
		            <label for="mail">Correo Electrónico:</label>
		            <input type="email" id="mail" th:field="*{mail}" class="form-control" placeholder="Ingrese el correo" required>
		        </div>

		        <div class="mb-3 form-group">
		            <label for="estado">Estado:</label>
		            <select id="estado" th:field="*{estado}" class="form-select" required>
		                <option value="true">Habilitado</option>
		                <option value="false">Inhabilitado</option>
		            </select>
		        </div>

		        <div class="d-flex justify-content-between">
		            <button type="submit" class="btn btn-primary">
		                <i class="fas fa-save"></i> Guardar Cliente
		            </button>
		            <a th:href="@{ / }" class="btn btn-secondary">
		                <i class="fas fa-home"></i> Volver al Inicio
		            </a>
		        </div>
		    </form>
		</div>
		
		   <script th:src="@{/js/jquery.slim.min.js}"></script>
		   <script th:src="@{/js/popper.min.js}"></script>
		   <script th:src="@{/js/bootstrap.min.js}"></script>

	</body>
	</html>
