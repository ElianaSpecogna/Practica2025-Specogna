<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="css/boostrap.min.css">
	
	<title>Alta Cliente</title>
	</head>
	<body>

	    <h2>Alta de Cliente</h2>

	    <form th:action="@{/altaCliente}" method="post" th:object="${cliente}">
			
	        <label for="nombre">Nombre:</label>
	        <input type="text" id="nombre" th:field="*{nombre}" required><br>

	        <label for="apellido">Apellido:</label>
	        <input type="text" id="apellido" th:field="*{apellido}" required><br>

	        <label for="dni">DNI:</label>
	        <input type="number" id="dni" th:field="*{dni}" required><br>

	        <label for="nombreUsuario">Nombre de Usuario:</label>
	        <input type="text" id="nombreUsuario" th:field="*{nombreUsuario}" required><br>

	        <label for="clave">Clave:</label>
	        <input type="password" id="clave" th:field="*{clave}" required><br>

	        <label for="direccion">Dirección:</label>
	        <input type="text" id="direccion" th:field="*{direccion}" required><br>

	        <label for="mail">Correo Electrónico:</label>
	        <input type="email" id="mail" th:field="*{mail}" required><br>

	        <label for="estado">Estado:</label>
	        <select id="estado" th:field="*{estado}" required>
	            <option value="true">Habilitado</option>
	            <option value="false">Inhabilitado</option>
	        </select><br>

	        <button type="submit">Guardar Cliente</button>
	    </form>
		   <script th:src="@{/js/jquery.slim.min.js}"></script>
		   <script th:src="@{/js/popper.min.js}"></script>
		   <script th:src="@{/js/bootstrap.min.js}"></script>

	</body>
	</html>
