<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://kit.fontawesome.com/57faba85b1.js"crossorigin="anonymous"></script>
    <title>Lista de Clientes</title>
    <link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        .table th, .table td {
            vertical-align: middle;
            text-align: center;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.7rem;
        }
        .table-container {
            margin-top: 20px;
        }
        h2 {
            color: #343a40;
            text-align: center;
            margin-bottom: 20px;
        }
		
		
    </style>
	
</head>
<body>

    <div class="container">
        <h2>Lista de Clientes</h2>

        <div class="table-container">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>DNI</th>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
					<!-- Muestra un mensaje si la lista esta vacia -->
					               <tr th:if="${listaC.size()} == 0">
					                   <td colspan="8" class="text-center">No se encontraron clientes.</td>
					               </tr>
                    <tr th:each="cliente : ${listaC}">
                        <td th:text="${cliente.id}"></td>
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.apellido}"></td>
                        <td th:text="${cliente.dni}"></td>
                        <td th:text="${cliente.nombreUsuario}"></td>
                        <td th:text="${cliente.mail}"></td>
                        <td th:text="${cliente.estado ? 'Habilitado' : 'Inhabilitado'}"></td>
						<td>
						    <a th:href="@{/eliminar/{id}(id=${cliente.id})}" class="btn btn-primary btn-sm">
						            <i class="fas fa-trash-alt"></i> Eliminar
						    </a>

						    <a th:href="@{/modificar/{id}(id=${cliente.id})}" class="btn btn-primary btn-sm">
						        <i class="fas fa-edit"></i> Editar
						    </a>
						</td>


                    </tr>
                </tbody>
            </table>
        </div>
		
		<div class="mt-3" th:if="${mensaje}">
		        <p class="alert alert-warning" th:text="${mensaje}"></p>
		    </div>

			<div class="d-flex justify-content-between mt-3">
			    <a th:href="@{/alta}" class="btn btn-success me-2">
			        <i class="fas fa-plus"></i> Agregar Nuevo Cliente
			    </a>
			    
			    <a th:href="@{ / }" class="btn btn-secondary">
			        <i class="fas fa-home"></i> Volver al Inicio
			    </a>
			</div>			
    </div>

	
	           <script th:src="@{/js/jquery.slim.min.js}"></script>
			   <script th:src="@{/js/popper.min.js}"></script>
			   <script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
