<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://kit.fontawesome.com/57faba85b1.js"crossorigin="anonymous"></script>
    <title>Lista de Clientes</title>
    <link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        .table th, .table td {
            vertical-align: middle;
            text-align: center;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.7rem;
        }
        .table-container {
            margin-top: 20px;
        }
        h2 {
            color: #343a40;
            text-align: center;
            margin-bottom: 20px;
        }
        .add-client-btn {
            margin-top: 10px;
            display: block;
            text-align: center;
        }
    </style>
	
</head>
<body>

    <div class="container">
        <h2>Lista de Clientes</h2>

        <div class="table-container">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>DNI</th>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${listaC}">
                        <td th:text="${cliente.id}"></td>
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.apellido}"></td>
                        <td th:text="${cliente.dni}"></td>
                        <td th:text="${cliente.nombreUsuario}"></td>
                        <td th:text="${cliente.mail}"></td>
                        <td th:text="${cliente.estado ? 'Habilitado' : 'Inhabilitado'}"></td>
                        <td>
                            <div class="btn-group" role="group">
                                <form th:action="@{'/eliminar/' + ${cliente.id}}" method="post">
                                    <button type="submit" class="btn btn-danger btn-sm"><i class="fa-solid fa-user-xmark"></i></button>
                                </form>
                                <form th:action="@{'/modificar/' + ${cliente.id}}" method="get">
                                    <button type="submit" class="btn btn-primary btn-sm"> <i class="fa-solid fa-user-pen"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="add-client-btn">
            <a href="/altaCliente" class="btn btn-success">Agregar Nuevo Cliente</a>
        </div>
    </div>

	
	           <script th:src="@{/js/jquery.slim.min.js}"></script>
			   <script th:src="@{/js/popper.min.js}"></script>
			   <script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
