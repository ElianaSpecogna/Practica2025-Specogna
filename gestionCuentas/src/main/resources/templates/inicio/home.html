<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Online - Inicio</title>
    <link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('/imagenes_inicio/imagen_inicio.png');
			background-repeat: no-repeat;
			background-position: center;
			background-size: cover;  
			background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
			
			
        }
        .container {
			
			background-color: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h2 {
            color: #0056b3;
            margin-bottom: 30px;
        }
        .btn-primary, .btn-outline-primary {
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            margin: 10px;
            min-width: 180px;
            display: inline-block;
            text-decoration: none;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        .btn-outline-primary {
            border-color: #007bff;
            color: #007bff;
        }
        .btn-outline-primary:hover {
            background-color: #007bff;
            color: white;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 8px;
        }
		.footer {
			width: 100%;
			    position: relative;  
			    bottom: 0;
			    background-color: #a3c9f5; 
			    color: #ffffff;  
			    padding: 10px 0;
			    font-size: 14px;
			    box-shadow: 0px -2px 4px rgba(0, 0, 0, 0.1);
			    margin-top: 20px;
		}
    </style>
</head>
<body>
    <div class="container">
        <h2>Banco Online</h2>
        <p class="lead mb-4">Seleccione la operación que desea realizar:</p>

        <div>
            <a th:href="@{/alta}" class="btn btn-primary">
                Alta Cliente
            </a>

            <a th:href="@{/lista}" class="btn btn-outline-primary">
                Listado de Clientes
            </a>
        </div>

        <div class="mt-4">
          
            <form th:action="@{/buscar}" method="get" style="display: inline-block;">
                <input type="text" name="dniParam" placeholder="Ingrese DNI" required>
                <button type="submit" class="btn btn-outline-primary">Buscar</button>
            </form>
        </div>
		
		<footer class="footer text-center py-2 mt-3">
		    <p class="mb-0">&copy; 2025 Banco Online. Todos los derechos reservados.</p>
		</footer>

        <!-- Resultados de la búsqueda -->
        <div class="result" th:if="${cliente}">
            <h4>Resultado de la Búsqueda:</h4>
            <p><strong>DNI:</strong> <span th:text="${cliente.dni}"></span></p>
            <p><strong>Nombre:</strong> <span th:text="${cliente.nombre}"></span></p>
            <p><strong>Correo:</strong> <span th:text="${cliente.correoElectronico}"></span></p>
        </div>

        <!-- Mensaje en caso de error -->
        <div class="result" th:if="${mensaje}">
            <p th:text="${mensaje}"></p>
        </div>
    </div>
    <script th:src="@{/js/jquery.slim.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
	
</body>
</html>
